# MariaDB
#    driver-class-name: org.mariadb.jdbc.Driver
#    url: jdbc:mariadb://{DB 서버 주소}:{DB 포트}/{DB 이름}?&serverTimezone=UTC&autoReconnect=true&allowMultiQueries=true&characterEncoding=UTF-8
#    username: DB 계정이름
#    password: DB 비밀번호
#
# table:
#  log: single or month (single : 단일 로그 테이블 | month : 월별 로그 테이블)
#
# wait:
#   seconds: 15 (default 15 / 원하는 초로 수정 -> 0 입력 시 부하 가능성 有)


